<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI / ML / DS · DSA Interview Notebook</title>
<style>
    /* ---------- THEME VARIABLES ---------- */
    :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #1e293b;
        --text-muted: #475569;
        --border: #e2e8f0;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        --radius: 14px;
        --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="dark"] {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --border: #334155;
        --accent: #60a5fa;
        --accent-soft: #1e3a5f;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 1rem; }

    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
    }

    /* ---------- APP HEADER ---------- */
    .app-header {
        max-width: 1420px;
        margin: 0 auto;
        padding: 1.5rem 1rem 1rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }
    .app-header h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.5px;
    }
    .app-header h1 span { color: var(--accent); }
    .app-header .subtitle {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-top: 0.15rem;
    }
    .theme-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
        font-size: 0.9rem;
        color: var(--text);
        box-shadow: var(--shadow);
        transition: border-color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-toggle .icon { font-size: 1.15rem; line-height: 1; }

    /* ---------- LAYOUT ---------- */
    .layout {
        max-width: 1420px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 1.5rem;
        padding: 0 1rem 3rem;
    }

    /* ---------- SIDEBAR / TOC ---------- */
    .sidebar {
        position: sticky;
        top: 1rem;
        align-self: start;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 0.9rem;
        box-shadow: var(--shadow);
        font-size: 0.85rem;
        transition: background 0.3s, border-color 0.3s;
    }
    .sidebar h2 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        margin-bottom: 0.8rem;
        padding: 0 0.3rem;
    }
    .sidebar details { margin-bottom: 0.3rem; }
    .sidebar summary {
        cursor: pointer;
        padding: 0.35rem 0.5rem;
        border-radius: 6px;
        font-weight: 600;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.4rem;
        transition: background 0.2s;
    }
    .sidebar summary::-webkit-details-marker { display: none; }
    .sidebar summary::before {
        content: '▸';
        display: inline-block;
        margin-right: 0.35rem;
        transition: transform 0.2s;
        color: var(--text-muted);
        font-size: 0.7rem;
    }
    .sidebar details[open] > summary::before { transform: rotate(90deg); }
    .sidebar summary:hover { background: var(--bg); }

    .sidebar details details summary {
        font-weight: 500;
        font-size: 0.8rem;
        color: var(--text-muted);
        padding-left: 0.2rem;
    }

    .sidebar a {
        display: block;
        padding: 0.25rem 0.5rem 0.25rem 1.6rem;
        color: var(--text-muted);
        text-decoration: none;
        border-radius: 5px;
        font-size: 0.79rem;
        line-height: 1.4;
        transition: background 0.15s, color 0.15s;
    }
    .sidebar a:hover {
        background: var(--accent-soft);
        color: var(--accent);
    }

    .badge {
        display: inline-block;
        font-size: 0.62rem;
        font-weight: 700;
        padding: 0.05rem 0.45rem;
        border-radius: 999px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text-muted);
        min-width: 1.4em;
        text-align: center;
    }

    /* ---------- CONTENT ---------- */
    .content { min-width: 0; }

    .search-bar { margin-bottom: 1.5rem; }
    .search-bar input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 0.95rem;
        box-shadow: var(--shadow);
        outline: none;
        transition: border-color 0.2s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--text-muted); }

    /* ---------- DIFFICULTY SECTIONS ---------- */
    .difficulty-section {
        margin-bottom: 2.5rem;
        scroll-margin-top: 1rem;
    }
    .difficulty-header {
        font-size: 1.4rem;
        font-weight: 700;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid var(--border);
        margin-bottom: 1.1rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        letter-spacing: -0.3px;
    }
    .difficulty-header.easy { border-color: #22c55e; }
    .difficulty-header.medium { border-color: #eab308; }
    .difficulty-header.hard { border-color: #ef4444; }

    /* ---------- SUBCATEGORY ---------- */
    .subcat-section {
        margin-bottom: 1.75rem;
        scroll-margin-top: 1rem;
    }
    .subcat-header {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .subcat-header::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
    }

    /* ---------- GRID ---------- */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.1rem;
    }

    /* ---------- CARD ---------- */
    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.2rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        transition: background 0.3s, border-color 0.2s, box-shadow 0.2s;
        scroll-margin-top: 1rem;
    }
    .card:hover {
        border-color: var(--accent);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
    }
    .problem-id {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
        letter-spacing: 0.3px;
    }
    .difficulty {
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }
    .difficulty.easy   { background: #dcfce7; color: #166534; }
    .difficulty.medium { background: #fef9c3; color: #854d0e; }
    .difficulty.hard   { background: #fee2e2; color: #991b1b; }
    [data-theme="dark"] .difficulty.easy   { background: #14532d; color: #86efac; }
    [data-theme="dark"] .difficulty.medium { background: #422006; color: #fde047; }
    [data-theme="dark"] .difficulty.hard   { background: #450a0a; color: #fca5a5; }

    .card-title {
        font-size: 1.02rem;
        font-weight: 700;
        line-height: 1.3;
    }
    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
    }
    .tag {
        font-size: 0.64rem;
        font-weight: 500;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text-muted);
        letter-spacing: 0.2px;
    }

    .section-label {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin-top: 0.2rem;
    }
    .explanation {
        font-size: 0.87rem;
        color: var(--text-muted);
        line-height: 1.55;
    }
    .steps {
        font-size: 0.85rem;
        color: var(--text);
        padding-left: 1.15rem;
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
    }
    .steps li::marker {
        color: var(--accent);
        font-weight: 700;
    }

    .interview-note {
        margin-top: 0.55rem;
        padding: 0.6rem 0.75rem;
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        font-size: 0.82rem;
        color: var(--text);
        line-height: 1.5;
    }
    .interview-note strong { color: var(--accent); }

    /* ---------- EMPTY STATE ---------- */
    .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        font-size: 1rem;
        display: none;
    }

    /* ---------- FOOTER ---------- */
    .footer {
        max-width: 1420px;
        margin: 0 auto;
        padding: 1.5rem 1rem 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 960px) {
        .layout { grid-template-columns: 1fr; }
        .sidebar {
            position: static;
            max-height: 320px;
            order: -1;
        }
    }
    @media (max-width: 600px) {
        .app-header h1 { font-size: 1.3rem; }
        .grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<header class="app-header">
    <div>
        <h1>AI / ML / DS · <span>DSA Notebook</span></h1>
        <p class="subtitle">LeetCode‑numbered · grouped by difficulty &amp; topic · with interview context</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="icon" id="themeIcon">🌙</span>
        <span id="themeLabel">Dark</span>
    </button>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Table of contents"></aside>
    <main class="content" id="content">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by title, number, tag, or difficulty…" />
        </div>
        <div id="problemsContainer"></div>
        <div class="empty-state" id="emptyState">No problems match your search.</div>
    </main>
</div>

<footer class="footer">
    Built for AI / ML / Data‑Science interview preparation · 2025–2026 market focus
</footer>

<script>
/* ============================================================
   PROBLEM DATA
   Each entry: id, title, difficulty, subcategory, tags,
               interview (context), explanation, steps
   ============================================================ */
const problems = [
    /* ==================== EASY ==================== */
    { id: 1,   difficulty: "Easy",   subcategory: "Arrays & Hashing", title: "Two Sum",
      tags: ["Array", "Hash Table"],
      interview: "Warm‑up in virtually every FAANG / quant phone screen. Also common in ML engineer loops as a hashing sanity check.",
      explanation: "Store seen numbers in a hash map (value → index). For each element check if its complement (target − current) is in the map. This turns an O(n²) scan into O(n).",
      steps: [
        "Create an empty hash map value → index.",
        "Iterate once through the array.",
        "Compute complement = target − nums[i].",
        "If complement is in the map, return [map[complement], i].",
        "Otherwise store nums[i] → i.",
        "Handle edge cases: exactly one solution guaranteed; array length ≥ 2."
      ]},
    { id: 217, difficulty: "Easy",   subcategory: "Arrays & Hashing", title: "Contains Duplicate",
      tags: ["Array", "Hash Set", "Sorting"],
      interview: "Screening question for data engineers and ML infra roles — tests set/hash usage.",
      explanation: "Insert elements into a hash set. If an element already exists, return true immediately.",
      steps: [
        "Create an empty hash set.",
        "Iterate through the array.",
        "If the element is already in the set, return true.",
        "Otherwise add it to the set.",
        "Return false after the loop.",
        "Mention trade‑offs: hash set is O(n) time / O(n) space; sorting is O(n log n) time / O(1) space."
      ]},
    { id: 125, difficulty: "Easy",   subcategory: "Two Pointers", title: "Valid Palindrome",
      tags: ["String", "Two Pointers"],
      interview: "Common in data‑scientist phone screens as a string‑manipulation filter.",
      explanation: "Two pointers from both ends. Skip non‑alphanumeric characters and compare case‑insensitively.",
      steps: [
        "Initialise left = 0, right = s.length − 1.",
        "While left < right: skip non‑alphanumeric from both sides.",
        "Compare lowercase(s[left]) with lowercase(s[right]).",
        "If they differ, return false.",
        "Otherwise advance both pointers.",
        "Return true when the pointers meet.",
        "Consider edge cases: empty string, punctuation‑only string."
      ]},
    { id: 20,  difficulty: "Easy",   subcategory: "Stack", title: "Valid Parentheses",
      tags: ["String", "Stack"],
      interview: "Classic stack warm‑up at FAANG and hedge‑fund tech screens.",
      explanation: "Push opening brackets onto a stack. On a closing bracket check the top of the stack matches. End with an empty stack.",
      steps: [
        "Initialise an empty stack.",
        "Map: ')' → '(', '}' → '{', ']' → '['.",
        "For each character: push if opening; on closing, verify stack top and pop.",
        "If a closing bracket appears on an empty stack, return false.",
        "Return stack.isEmpty() at the end."
      ]},
    { id: 704, difficulty: "Easy",   subcategory: "Binary Search", title: "Binary Search",
      tags: ["Array", "Binary Search"],
      interview: "Foundational — appears as a sub‑step in nearly every ML / research engineer interview.",
      explanation: "Maintain left/right pointers, compute mid, and halve the search space each step.",
      steps: [
        "Initialise left = 0, right = n − 1.",
        "While left ≤ right:",
        "  • mid = left + (right − left) // 2 to avoid overflow.",
        "  • If nums[mid] == target, return mid.",
        "  • If nums[mid] < target, left = mid + 1; else right = mid − 1.",
        "Return −1 if not found."
      ]},
    { id: 206, difficulty: "Easy",   subcategory: "Linked List", title: "Reverse Linked List",
      tags: ["Linked List", "Recursion"],
      interview: "Staple at Google, Meta, and trading firms for new‑grad SWE and ML engineers.",
      explanation: "Iteratively reverse pointers using prev, curr, next. Recursive version is a natural follow‑up.",
      steps: [
        "prev = null, curr = head.",
        "While curr:",
        "  • next = curr.next.",
        "  • curr.next = prev.",
        "  • prev = curr; curr = next.",
        "Return prev (new head).",
        "Discuss the O(n) iterative and O(n) recursive versions."
      ]},
    { id: 21,  difficulty: "Easy",   subcategory: "Linked List", title: "Merge Two Sorted Lists",
      tags: ["Linked List", "Recursion"],
      interview: "Common in data‑pipeline engineer screens — tests pointer discipline.",
      explanation: "Use a dummy node; attach the smaller head at each step; append the remaining list.",
      steps: [
        "Create a dummy node and a tail pointer.",
        "While both lists non‑empty: attach smaller head to tail.next; advance that list.",
        "Append the non‑empty remainder.",
        "Return dummy.next.",
        "Mention the recursive alternative."
      ]},
    { id: 141, difficulty: "Easy",   subcategory: "Linked List", title: "Linked List Cycle",
      tags: ["Linked List", "Two Pointers"],
      interview: "Floyd's algorithm is a favorite probing question in ML infra loops.",
      explanation: "Floyd's tortoise and hare: slow moves 1 step, fast moves 2. If they meet, there is a cycle.",
      steps: [
        "slow = head, fast = head.",
        "While fast and fast.next:",
        "  • slow = slow.next.",
        "  • fast = fast.next.next.",
        "  • If slow == fast, return true.",
        "Return false.",
        "Highlight O(n) time and O(1) space."
      ]},
    { id: 104, difficulty: "Easy",   subcategory: "Trees", title: "Maximum Depth of Binary Tree",
      tags: ["Tree", "DFS", "BFS"],
      interview: "Intro tree‑recursion question in nearly every DS / ML interview.",
      explanation: "Depth = 1 + max(depth(left), depth(right)). BFS with level counting is an equivalent approach.",
      steps: [
        "If root is null, return 0.",
        "leftDepth = maxDepth(root.left).",
        "rightDepth = maxDepth(root.right).",
        "Return 1 + max(leftDepth, rightDepth).",
        "Discuss O(n) time and O(h) space (recursion stack)."
      ]},
    { id: 226, difficulty: "Easy",   subcategory: "Trees", title: "Invert Binary Tree",
      tags: ["Tree", "DFS", "BFS"],
      interview: "Fun warm‑up seen at Meta and Netflix — tests recursion intuition.",
      explanation: "Swap left/right children of every node, recursively or with a stack/queue.",
      steps: [
        "If root is null, return null.",
        "Swap root.left and root.right.",
        "Recursively invert both subtrees.",
        "Return root."
      ]},
    { id: 235, difficulty: "Easy",   subcategory: "Trees", title: "Lowest Common Ancestor of a BST",
      tags: ["Tree", "BST", "DFS"],
      interview: "Classic BST question in ML platform and recommendation‑system team screens.",
      explanation: "Walk down from the root: while both p and q are on the same side, keep descending; the split point is the LCA.",
      steps: [
        "Start at the root.",
        "While root is not null:",
        "  • If p and q are both < root.val, go left.",
        "  • Else if both > root.val, go right.",
        "  • Else return root.",
        "Time O(h), space O(1)."
      ]},
    { id: 70,  difficulty: "Easy",   subcategory: "Dynamic Programming", title: "Climbing Stairs",
      tags: ["DP", "Math"],
      interview: "Signature DP warm‑up; extremely common in DS / ML phone screens.",
      explanation: "dp[i] = dp[i−1] + dp[i−2] — Fibonacci. O(1) space with two variables.",
      steps: [
        "If n ≤ 2, return n.",
        "prev2 = 1 (ways to reach step 1), prev1 = 2 (ways to reach step 2).",
        "For i in 3..n: cur = prev1 + prev2; prev2 = prev1; prev1 = cur.",
        "Return prev1.",
        "Explain the recurrence relation."
      ]},
    { id: 202, difficulty: "Easy",   subcategory: "Math & Probability", title: "Happy Number",
      tags: ["Math", "Hash Set", "Two Pointers"],
      interview: "Cycle‑detection question often used in data‑scientist screenings.",
      explanation: "Repeatedly replace n with the sum of the squares of its digits. If it reaches 1 → happy; if it cycles → not happy.",
      steps: [
        "Helper sumOfSquares(n).",
        "Use a set to detect cycles (or Floyd's slow/fast pointers for O(1) space).",
        "While n ≠ 1 and n not in set: add n; n = sumOfSquares(n).",
        "Return n == 1.",
        "Explain why the process always terminates."
      ]},

    /* ==================== MEDIUM ==================== */
    { id: 49,  difficulty: "Medium", subcategory: "Arrays & Hashing", title: "Group Anagrams",
      tags: ["Array", "Hash Table", "String"],
      interview: "Common in data engineer and ML platform interviews — hashing + string canonicalisation.",
      explanation: "Key = sorted word (or 26‑length count tuple). Group words by key in a hash map.",
      steps: [
        "Create an empty map: key → list of words.",
        "For each word, compute its canonical key.",
        "Append the word to map[key].",
        "Return all map values.",
        "Mention trade‑offs: sorting is O(L log L); counting is O(L) with a 26‑length tuple."
      ]},
    { id: 238, difficulty: "Medium", subcategory: "Arrays & Hashing", title: "Product of Array Except Self",
      tags: ["Array", "Prefix Product"],
      interview: "Frequent at Meta and Airbnb; tests prefix/suffix intuition used in feature engineering.",
      explanation: "Compute prefix products left‑to‑right, then multiply by running suffix products right‑to‑left, in place.",
      steps: [
        "Create output array of length n.",
        "Left pass: out[i] = product of all elements before i (start at 1).",
        "Right pass: maintain suffix = 1; out[i] *= suffix; suffix *= nums[i].",
        "Return out.",
        "Note O(n) time and O(1) extra space."
      ]},
    { id: 53,  difficulty: "Medium", subcategory: "Arrays & Hashing", title: "Maximum Subarray",
      tags: ["Array", "DP", "Kadane"],
      interview: "Kadane's — a favourite in quant and time‑series ML interviews.",
      explanation: "Kadane's: running sum; if it drops below zero, reset to zero; track the maximum seen.",
      steps: [
        "cur = 0, best = −∞.",
        "For each x: cur += x; best = max(best, cur); if cur < 0, cur = 0.",
        "Return best.",
        "Handle all‑negative arrays (best holds the largest single element)."
      ]},
    { id: 152, difficulty: "Medium", subcategory: "Arrays & Hashing", title: "Maximum Product Subarray",
      tags: ["Array", "DP"],
      interview: "Follow‑up to Kadane; seen in finance ML and risk‑modeling loops.",
      explanation: "Track both max and min products ending at the current position because negative × negative = positive.",
      steps: [
        "Initialise maxProd = minProd = best = nums[0].",
        "For each x (from 1..n−1): compute candidates (x, maxProd×x, minProd×x).",
        "New maxProd = max of three; new minProd = min of three.",
        "best = max(best, maxProd).",
        "Return best."
      ]},
    { id: 54,  difficulty: "Medium", subcategory: "Matrix", title: "Spiral Matrix",
      tags: ["Array", "Matrix", "Simulation"],
      interview: "Frequent in computer‑vision and 2D‑data‑processing interviews.",
      explanation: "Maintain four boundaries (top, bottom, left, right) and shrink them as you traverse each ring.",
      steps: [
        "top=0, bottom=rows−1, left=0, right=cols−1.",
        "While top≤bottom and left≤right: traverse top row, right col, bottom row (if still valid), left col (if valid).",
        "Shrink boundaries after each traversal.",
        "Collect and return the values.",
        "Handle single row / single column cases."
      ]},
    { id: 48,  difficulty: "Medium", subcategory: "Matrix", title: "Rotate Image",
      tags: ["Array", "Matrix", "Math"],
      interview: "Classic in CV / image‑pipeline engineer interviews.",
      explanation: "90° clockwise rotation = transpose + reverse every row. Do it in place.",
      steps: [
        "Transpose: swap matrix[i][j] ↔ matrix[j][i] for i<j.",
        "Reverse each row in place.",
        "Explain why transpose + reverse = clockwise rotation.",
        "O(n²) time, O(1) extra space."
      ]},
    { id: 73,  difficulty: "Medium", subcategory: "Matrix", title: "Set Matrix Zeroes",

   ============================================================ */
const DIFFICULTIES = ["Easy", "Medium", "Hard"];

function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

// Group filtered problems by difficulty → subcategory.
function groupByDifficulty(list) {
    const grouped = { Easy: {}, Medium: {}, Hard: {} };
    list.forEach(p => {
        if (!grouped[p.difficulty][p.subcategory]) grouped[p.difficulty][p.subcategory] = [];
        grouped[p.difficulty][p.subcategory].push(p);
    });
    return grouped;
}

function totalIn(obj) {
    return Object.values(obj).reduce((s, arr) => s + arr.length, 0);
}

/* ---------- Sidebar (TOC) ---------- */
function renderSidebar(grouped) {
    const sidebar = document.getElementById('sidebar');
    let html = '<h2>Contents</h2>';

    DIFFICULTIES.forEach(diff => {
        const subcats = grouped[diff];
        const total = totalIn(subcats);
        if (total === 0) return;

        html += `<details open><summary>${diff}<span class="badge">${total}</span></summary>`;

        Object.keys(subcats).sort().forEach(sub => {
            const items = subcats[sub];
            html += `<details open><summary>${sub}<span class="badge">${items.length}</span></summary>`;
            items.forEach(p => {
                html += `<a href="#p-${p.id}">#${p.id} ${p.title}</a>`;
            });
            html += `</details>`;
        });

        html += `</details>`;
    });

    sidebar.innerHTML = html;
}

/* ---------- Card ---------- */
function renderCard(p) {
    const diffClass = p.difficulty.toLowerCase();
    const tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
    const stepsHtml = p.steps.map(s => `<li>${s}</li>`).join('');

    return `<div class="card" id="p-${p.id}">
        <div class="card-header">
            <span class="problem-id">#${p.id}</span>
            <span class="difficulty ${diffClass}">${p.difficulty}</span>
        </div>
        <div class="card-title">${p.title}</div>
        <div class="tags">${tagsHtml}</div>
        <div class="section-label">Explanation</div>
        <div class="explanation">${p.explanation}</div>
        <div class="section-label">Steps / Approach</div>
        <ol class="steps">${stepsHtml}</ol>
        <div class="interview-note"><strong>Where you'll see it:</strong> ${p.interview}</div>
    </div>`;
}

/* ---------- Main content ---------- */
function renderContent(grouped) {
    const container = document.getElementById('problemsContainer');
    const emptyState = document.getElementById('emptyState');

    let any = false;
    let html = '';

    DIFFICULTIES.forEach(diff => {
        const subcats = grouped[diff];
        const total = totalIn(subcats);
        if (total === 0) return;
        any = true;

        html += `<section class="difficulty-section" id="d-${diff.toLowerCase()}">
            <h2 class="difficulty-header ${diff.toLowerCase()}">${diff}<span class="badge">${total}</span></h2>`;

        Object.keys(subcats).sort().forEach(sub => {
            const items = subcats[sub];
            html += `<div class="subcat-section" id="s-${diff.toLowerCase()}-${slug(sub)}">
                <div class="subcat-header">${sub}</div>
                <div class="grid">`;
            items.forEach(p => { html += renderCard(p); });
            html += `</div></div>`;
        });

        html += `</section>`;
    });

    container.innerHTML = html;
    emptyState.style.display = any ? 'none' : 'block';
}

/* ---------- Filter ---------- */
function applyFilter(query) {
    const q = query.toLowerCase().trim();
    const filtered = !q
        ? problems
        : problems.filter(p =>
            p.title.toLowerCase().includes(q) ||
            p.id.toString().includes(q) ||
            p.tags.some(t => t.toLowerCase().includes(q)) ||
            p.difficulty.toLowerCase().includes(q) ||
            p.subcategory.toLowerCase().includes(q)
        );
    const grouped = groupByDifficulty(filtered);
    renderSidebar(grouped);
    renderContent(grouped);
}

/* ============================================================
   THEME
   ============================================================ */
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');
const root = document.documentElement;

function setTheme(theme) {
    if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Light';
    } else {
        root.removeAttribute('data-theme');
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Dark';
    }
    try { localStorage.setItem('theme', theme); } catch (e) {}
}

themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    setTheme(current === 'dark' ? 'light' : 'dark');
});

let savedTheme = 'light';
try { savedTheme = localStorage.getItem('theme') || 'light'; } catch (e) {}
setTheme(savedTheme);

/* ============================================================
   SEARCH & INIT
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', e => applyFilter(e.target.value));

applyFilter('');
</script>
